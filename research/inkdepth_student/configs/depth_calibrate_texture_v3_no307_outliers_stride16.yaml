seed: 1337
output_dir: outputs/depth_calibrate_texture_v3_no307_outliers_stride16

data:
  manifest_path: /data/baseAVIs_432x672/manifest_texture_replacement_v3_no_missing_h5_no_black_participant_splits_no307_depth_outliers.json
  rgb_source: auto
  input_source: rgb
  frame_root: null
  video_root: null
  frame_stride: 16
  max_frames_per_video: null
  max_videos_per_split: null
  depth:
    format: zarr
    path: null
    key: depth_norm
    cache_size: 128
  labels:
    load: auto
    format: inkmarc_h5
    path: null
    label_mode: derive_from_pressure_and_xy
    background_policy: invalid_xy_is_background
    coordinate_mode: surface_to_image
    state_key: state
    touch_key: touch
    x_key: x
    y_key: y
    xy_normalized: true
    image_width: 432
    image_height: 672
    surface_width: 44800.0
    surface_height: 29600.0
    surface_model_width: 480
    surface_model_height: 320
    corners_coordinate_mode: resized
    tablet_width: 44800.0
    tablet_height: 29600.0
    pressure_touch_threshold: 0.0
  input_size: [672, 432]
  synthetic:
    enabled: false
    length: 64

augment:
  color_jitter: true
  brightness: 0.12
  contrast: 0.12
  saturation: 0.08
  hue: 0.015
  blur_prob: 0.03
  noise_std: 0.005

model:
  name: InkDepthStudent
  backbone: mobilenet_v3_large
  width_mult: 1.0
  pretrained: true
  fpn_channels: 96
  depth_out_size: [168, 108]
  depth_mode: normalized
  state_mode: multiclass
  num_states: 3
  use_depth_features_for_tasks: true
  depth_feature_source: decoder
  state_context_mode: gap
  train_depth: true
  train_touch: false
  train_state: false
  train_location: false
  freeze_backbone: false
  freeze_neck: false
  freeze_depth_head: false
  freeze_state_head: true
  freeze_location_head: true

loss:
  lambda_depth_ssi: 0.5
  lambda_depth_l1: 0.2
  lambda_depth_grad: 1.0
  lambda_touch: 0.0
  lambda_state: 0.0
  lambda_xy: 0.0
  lambda_heatmap: 0.0
  state_label_smoothing: 0.0
  heatmap_loss: mse
  xy_loss: smooth_l1

training:
  phase: depth_pretrain
  epochs: 2
  batch_size: 32
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  amp: true
  init_checkpoint: outputs/depth_calibrate_texture_v3_no307_outliers_stride64/best_val_loss.pt
  init_strict: true
  resume: null
  log_every: 50
  val_every: 1
  save_visuals: true
  max_visuals: 8
  sampler: uniform
  copy_manifest: true
  tensorboard: false

optimizer:
  name: AdamW
  backbone_lr: 0.000005
  head_lr: 0.00005
  weight_decay: 0.01

scheduler:
  enabled: false
  name: cosine
  min_lr: 0.000001
