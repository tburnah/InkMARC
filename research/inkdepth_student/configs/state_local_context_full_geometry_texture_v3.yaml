seed: 1337
output_dir: outputs/state_local_context_full_geometry_texture_v3

data:
  manifest_path: /data/baseAVIs_432x672/manifest_texture_v3_balanced_frames_tune.json
  rgb_source: auto
  frame_root: null
  video_root: null
  frame_stride: 1
  max_frames_per_video: null
  max_videos_per_split: null
  depth:
    format: zarr
    path: null
    key: depth_norm
    cache_size: 64
  labels:
    load: auto
    format: inkmarc_h5
    path: null
    label_mode: derive_from_pressure_and_xy
    background_policy: invalid_xy_is_background
    coordinate_mode: surface_to_image
    state_key: state
    touch_key: touch
    x_key: x
    y_key: y
    xy_normalized: true
    image_width: 432
    image_height: 672
    surface_width: 44800.0
    surface_height: 29600.0
    surface_model_width: 480
    surface_model_height: 320
    corners_coordinate_mode: resized
    tablet_width: 44800.0
    tablet_height: 29600.0
    pressure_touch_threshold: 0.0
  input_size: [672, 432]
  synthetic:
    enabled: false
    length: 64

augment:
  color_jitter: true
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.02
  blur_prob: 0.05
  noise_std: 0.01

model:
  name: InkDepthStudent
  backbone: mobilenet_v3_large
  width_mult: 1.0
  pretrained: true
  fpn_channels: 96
  depth_out_size: [168, 108]
  depth_mode: normalized
  state_mode: multiclass
  num_states: 3
  use_depth_features_for_tasks: true
  depth_feature_source: decoder
  state_context_mode: gap_xy
  train_depth: true
  train_touch: false
  train_state: true
  train_location: true
  freeze_backbone: true
  freeze_neck: false
  freeze_depth_head: false
  freeze_state_head: false
  freeze_location_head: false

loss:
  lambda_depth_ssi: 2.0
  lambda_depth_grad: 4.0
  lambda_touch: 0.0
  lambda_state: 2.0
  lambda_xy: 10.0
  lambda_heatmap: 2.0
  state_label_smoothing: 0.05
  heatmap_loss: mse
  xy_loss: smooth_l1

training:
  phase: multitask
  epochs: 5
  batch_size: 32
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  amp: true
  init_checkpoint: outputs/location_refine_full_depth_texture_v3/best_xy.pt
  init_strict: false
  init_skip_mismatched: true
  resume: null
  log_every: 20
  val_every: 1
  save_visuals: false
  max_visuals: 8
  sampler: class_balanced
  copy_manifest: true
  tensorboard: false

optimizer:
  name: AdamW
  backbone_lr: 0.0
  head_lr: 0.0001
  weight_decay: 0.01

scheduler:
  enabled: false
  name: cosine
  min_lr: 0.000001
