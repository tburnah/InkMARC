seed: 1337
output_dir: outputs/inkmarc_rgbd_geometry_export_best_strict

data:
  manifest_path: /data/baseAVIs_432x672/manifest_original_no307_no321_frames_stride2_stable_w3.json
  rgb_source: auto
  input_source: rgbd
  frame_root: null
  video_root: null
  frame_stride: 1
  max_frames_per_video: null
  max_videos_per_split: null
  variant_kind_filter: [original]
  surface_geometry:
    enabled: true
  depth:
    format: zarr
    path: null
    key: depth_norm
    cache_size: 0
  labels:
    load: auto
    format: inkmarc_h5
    path: null
    label_mode: derive_from_pressure_and_xy
    touch_target: pressure
    background_policy: invalid_xy_is_background
    coordinate_mode: surface_to_image
    state_key: state
    touch_key: touch
    x_key: x
    y_key: y
    xy_normalized: true
    image_width: 432
    image_height: 672
    surface_width: 44800.0
    surface_height: 29600.0
    surface_model_width: 480
    surface_model_height: 320
    corners_coordinate_mode: resized
    tablet_width: 44800.0
    tablet_height: 29600.0
    pressure_touch_threshold: 0.0
  input_size: [672, 432]
  synthetic:
    enabled: false
    length: 64

augment:
  color_jitter: false
  brightness: 0.0
  contrast: 0.0
  saturation: 0.0
  hue: 0.0
  blur_prob: 0.0
  noise_std: 0.0

model:
  name: InkDepthStudent
  backbone: mobilenet_v3_large
  input_channels: 7
  width_mult: 1.0
  pretrained: false
  fpn_channels: 96
  depth_out_size: [168, 108]
  state_mode: binary
  num_states: 3
  presence_num_states: 2
  use_depth_features_for_tasks: false
  depth_feature_source: decoder
  state_context_mode: gap_xy_depth
  location_head_type: heatmap
  train_depth: false
  train_touch: true
  train_state: false
  train_location: true
  external_depth_channel: true
  freeze_backbone: false
  freeze_neck: false
  freeze_depth_head: false
  freeze_state_head: false
  freeze_location_head: false
  freeze_presence_head: false

loss:
  lambda_depth_ssi: 0.0
  lambda_depth_l1: 0.0
  lambda_depth_roi_l1: 0.0
  lambda_depth_grad: 0.0
  lambda_touch: 2.0
  lambda_state: 0.0
  lambda_xy: 0.2
  lambda_heatmap: 0.5
  state_label_smoothing: 0.0
  heatmap_loss: mse
  xy_loss: smooth_l1

training:
  phase: export
  epochs: 0
  batch_size: 1
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  amp: false
  init_checkpoint: outputs/inkmarc_rgbd_geometry_export_best_strict/inkmarc_rgbd_geometry_best_strict.pt
  init_strict: true
  init_skip_mismatched: false
  resume: null
  log_every: 20
  val_every: 1
  save_visuals: false
  max_visuals: 8
  sampler: touch_balanced
  copy_manifest: false
  tensorboard: false

optimizer:
  name: AdamW
  backbone_lr: 0.00003
  head_lr: 0.0002
  weight_decay: 0.01

scheduler:
  enabled: false
  name: cosine
  min_lr: 0.000001
