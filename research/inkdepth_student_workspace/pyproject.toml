[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkdepth-student"
version = "0.1.0"
description = "Mobile student model training scaffold for stylus tracking with auxiliary depth supervision"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["inkdepth*"]
