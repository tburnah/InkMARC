seed: 1337
output_dir: outputs/inkdepth_mobilenetv3

data:
  manifest_path: /data/baseAVIs_432x672/manifest.json
  rgb_source: auto          # auto | video | frame_dir
  frame_root: null
  video_root: null
  frame_stride: 1
  max_frames_per_video: null
  max_videos_per_split: null
  depth:
    format: zarr           # zarr | h5 | none
    path: null             # if null, reader looks for depth_path fields in manifest entries
    key: depth_norm        # zarr/h5 array name when using a single store
    cache_size: 64         # per-worker depth store cache limit
  labels:
    load: auto                 # auto skips label/H5 reads when no active task needs labels
    format: inkmarc_h5     # manifest | json | csv | h5 | inkmarc_h5 | none
    path: null
    label_mode: derive_from_pressure_and_xy # use_h5_state_if_available | derive_from_pressure_and_xy
    background_policy: invalid_xy_is_background # missing_xy_is_background | missing_h5_is_unlabeled | invalid_xy_is_background
    coordinate_mode: surface_to_image # auto | normalized | image_pixels | surface_pixels | surface_to_image
    state_key: state
    touch_key: touch
    x_key: x
    y_key: y
    xy_normalized: true
    image_width: 432
    image_height: 672
    surface_width: 44800.0
    surface_height: 29600.0
    surface_model_width: 480
    surface_model_height: 320
    corners_coordinate_mode: resized # resized | original
    tablet_width: 44800.0  # backward-compatible alias for surface_width
    tablet_height: 29600.0 # backward-compatible alias for surface_height
    pressure_touch_threshold: 0.0
  input_size: [672, 432]   # [H, W]
  synthetic:
    enabled: false
    length: 64

augment:
  color_jitter: true
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.02
  blur_prob: 0.05
  noise_std: 0.01

model:
  name: InkMARCSense
  backbone: mobilenet_v3_large
  width_mult: 1.0
  pretrained: true
  fpn_channels: 96
  depth_out_size: [168, 108]     # [H, W], 1/4 resolution for 672x432
  depth_mode: normalized         # normalized | inverse
  state_mode: binary             # binary | multiclass
  num_states: 3
  use_depth_features_for_tasks: true
  depth_feature_source: decoder  # decoder | p4
  state_context_mode: gap        # gap | gap_xy
  train_depth: true
  train_touch: true
  train_state: true
  train_location: true
  freeze_backbone: false
  freeze_neck: false
  freeze_depth_head: false
  freeze_state_head: false
  freeze_location_head: false

loss:
  lambda_depth_ssi: 1.0
  lambda_depth_grad: 2.0
  lambda_touch: 2.0
  lambda_state: 2.0
  lambda_xy: 5.0
  lambda_heatmap: 1.0
  state_label_smoothing: 0.0
  heatmap_loss: mse             # mse | bce
  xy_loss: smooth_l1            # l1 | smooth_l1

training:
  phase: multitask              # depth_pretrain | multitask | task_finetune
  epochs: 20
  batch_size: 8
  num_workers: 4
  persistent_workers: false
  prefetch_factor: null
  amp: true
  init_checkpoint: null     # model weights only; starts a fresh run/optimizer
  init_strict: true
  resume: null
  log_every: 20
  val_every: 1
  save_visuals: true
  max_visuals: 8
  sampler: uniform        # uniform | class_balanced | valid_xy_only | valid_xy_balanced | touch_balanced | touch_oversample
  copy_manifest: true
  tensorboard: false      # CSV/JSON logging is always enabled; true may emit TensorFlow logs in some envs

optimizer:
  name: AdamW
  backbone_lr: 0.00005
  head_lr: 0.0003
  weight_decay: 0.01

scheduler:
  enabled: false
  name: cosine
  min_lr: 0.000001
