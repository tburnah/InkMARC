seed: 1337
output_dir: outputs/final_inference_student_rgbd_geometry

data:
  manifest_path: outputs/diagnostic_manifests/manifest_final_training_original_apriltag_frames_stride4_stable_w5_p1000_no307_no321_all_train.json
  rgb_source: auto
  input_source: rgbd
  frame_root: null
  video_root: null
  frame_stride: 1
  max_frames_per_video: null
  max_videos_per_split: null
  variant_kind_filter: [original]
  surface_geometry:
    enabled: true
  depth:
    format: zarr
    path: null
    key: depth_norm
    cache_size: 0
  labels:
    load: auto
    format: inkmarc_h5
    path: null
    label_mode: derive_from_pressure_and_xy
    touch_target: pressure
    background_policy: invalid_xy_is_background
    coordinate_mode: surface_to_image
    state_key: state
    touch_key: touch
    x_key: x
    y_key: y
    xy_normalized: true
    image_width: 432
    image_height: 672
    surface_width: 44800.0
    surface_height: 29600.0
    surface_model_width: 480
    surface_model_height: 320
    corners_coordinate_mode: resized
    tablet_width: 44800.0
    tablet_height: 29600.0
    pressure_touch_threshold: 0.0
  input_size: [672, 432]
  synthetic:
    enabled: false
    length: 64

augment:
  color_jitter: true
  brightness: 0.08
  contrast: 0.08
  saturation: 0.05
  hue: 0.01
  blur_prob: 0.02
  noise_std: 0.005

model:
  name: InkMARCSense
  backbone: mobilenet_v3_large
  input_channels: 7
  width_mult: 1.0
  pretrained: true
  fpn_channels: 96
  depth_out_size: [168, 108]
  state_mode: binary
  num_states: 3
  presence_num_states: 2
  use_depth_features_for_tasks: false
  depth_feature_source: decoder
  state_context_mode: gap_xy_depth
  location_head_type: heatmap
  train_depth: false
  train_touch: true
  train_state: true
  train_location: true
  external_depth_channel: true
  freeze_backbone: true
  freeze_neck: true
  freeze_depth_head: true
  freeze_state_head: false
  freeze_location_head: true
  freeze_presence_head: false

loss:
  lambda_depth_ssi: 0.0
  lambda_depth_l1: 0.0
  lambda_depth_roi_l1: 0.0
  lambda_depth_grad: 0.0
  lambda_touch: 1.0
  lambda_state: 1.0
  lambda_xy: 0.0
  lambda_heatmap: 0.0
  state_label_smoothing: 0.05
  state_target: presence
  heatmap_loss: mse
  xy_loss: smooth_l1

training:
  phase: task_finetune
  epochs: 6
  batch_size: 8
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  init_checkpoint: outputs/final_combined_live_da3_geometry_heatmap_touch_presence_from_best_xy/deployable_student_latest.pt
  init_strict: false
  init_skip_mismatched: true
  resume: null
  log_every: 20
  val_every: 1
  save_visuals: false
  max_visuals: 8
  sampler: presence_balanced
  copy_manifest: true
  tensorboard: false

optimizer:
  name: AdamW
  backbone_lr: 0.0
  head_lr: 0.0003
  weight_decay: 0.01

scheduler:
  enabled: true
  name: cosine
  min_lr: 0.000001
